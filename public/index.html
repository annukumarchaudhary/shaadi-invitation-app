<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Didi Ki Shaadi - Invitation Tracker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gate-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff9f5;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .gate-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
            border-top: 5px solid #800020;
        }
        .gate-card h2 { color: #800020; margin-bottom: 10px; font-size: 20px; }
        .gate-card p { font-size: 13px; color: #666; margin-bottom: 20px; }
        .gate-card input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            text-align: center;
        }
        .gate-card button {
            width: 100%;
            padding: 10px;
            background: #800020;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .gate-error { color: #d9534f; font-size: 12px; margin-top: 10px; font-weight: bold; }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-btns {
            display: flex;
            gap: 8px;
        }
        .btn-header {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-logout { background: #6c757d; color: white; }
        .btn-manage { background: #333; color: white; }
    </style>
</head>
<body>

    <!-- Security Login Gate -->
    <div id="loginGate" class="gate-overlay">
        <div class="gate-card">
            <h2>✨ Portal Locked ✨</h2>
            <p>Kripya aage badhne ke liye password dalein.</p>
            <input type="password" id="gatePassword" placeholder="Enter Password...">
            <button id="btnGateLogin">Unlock Portal</button>
            <div id="gateError" class="gate-error"></div>
        </div>
    </div>

    <!-- Main Entry Container -->
    <div id="appContent" class="container" style="display: none;">
        <div class="app-header">
            <h1 style="margin: 0; color: #800020; font-size: 24px;">✨ Didi Ki Shaadi - Invitation Tracker ✨</h1>
            <div class="header-btns">
                <button id="logoutBtn" class="btn-header btn-logout">🔒 Logout</button>
                <button id="manageBtn" class="btn-header btn-manage">Manage Panel</button>
            </div>
        </div>

        <div class="card">
            <h2>Add New Relative</h2>
            <form id="relativeForm">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" list="nameSuggestions" required autocomplete="off" placeholder="Relative ka naam dalein...">
                    <datalist id="nameSuggestions"></datalist>
                </div>

                <div class="form-group">
                    <label for="address">Address / Location (Village, City, Mohalla):</label>
                    <input type="text" id="address" list="addressSuggestions" required autocomplete="off" placeholder="Gao ya shehar ka naam...">
                    <datalist id="addressSuggestions"></datalist>
                    <div style="margin-top: 5px;">
                        <input type="checkbox" id="lockAddress">
                        <label for="lockAddress" style="font-weight: normal; font-size: 0.85rem; color: #800020; cursor: pointer;">
                            🔒 Lock Address (Agli entry ke liye yahi address rahega)
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="guests">Number of Guests (Card Count):</label>
                    <select id="guests">
                        <option value="1">1 Person (Default)</option>
                        <option value="2">2 Persons</option>
                        <option value="3">3 Persons</option>
                        <option value="4">4 Persons</option>
                        <option value="5">5 Persons</option>
                        <option value="6">6 Persons</option>
                        <option value="7">7 Persons</option>
                        <option value="8">8 Persons</option>
                        <option value="9">9 Persons</option>
                        <option value="10">10 Persons</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (Optional):</label>
                    <input type="text" id="phone" list="phoneSuggestions" autocomplete="off" placeholder="Mobile number...">
                    <datalist id="phoneSuggestions"></datalist>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="submitBtn">Submit Entry</button>
                    <button type="button" id="clearBtn" class="btn-clear" style="background: #e9ecef; color: #333; border: 1px solid #ccc; padding: 10px 16px; border-radius: 4px; cursor: pointer;">Clear Form</button>
                </div>
            </form>
        </div>

        <div class="card search-card">
            <h2>Quick Search Records</h2>
            <div class="form-group">
                <input type="text" id="searchLocation" placeholder="Type name or village to search instantly...">
            </div>
            
            <div id="exportArea" style="margin-bottom: 12px; display: none;">
                <button type="button" id="exportPdfBtn" style="background-color: #28a745; color: white; padding: 8px 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
                    📄 Export Filtered to PDF
                </button>
            </div>

            <div id="searchResults" class="results-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
