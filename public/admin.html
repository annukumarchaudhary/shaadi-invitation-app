<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Manage Invitation Entries</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:20px;background-color:#fff9f5;color:#333;}
    table{border-collapse:collapse;width:100%;margin-top:15px;}
    th,td{border:1px solid #ddd;padding:10px;text-align:left;}
    th{background:#800020;color:white;}
    tr:nth-child(even){background-color: #f9f9f9;}
    .controls{display:flex;gap:6px;flex-wrap:nowrap;}
    .top{display:flex;gap:10px;align-items:center;margin-bottom:15px;flex-wrap:wrap;}
    input[type="password"], input[type="text"], select{padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px;box-sizing:border-box;}
    button{padding:8px 14px;background:#333;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;font-weight:bold;}
    button:hover{opacity:0.9;}
    #clearAll{background:#800020;}
    .delete{background:#d9534f;padding:6px 10px;font-size:12px;}
    #exportAdminPdf{background:#28a745;}
    #sortDirBtn{background:#007bff;}
    
    #goToEntryBtn { background-color: #800020; color: white; }
    .edit-btn { background-color: #007bff; padding: 6px 10px; font-size: 12px; color: white; }
    .save-btn { background-color: #28a745; padding: 6px 10px; font-size: 12px; color: white; }
    .cancel-btn { background-color: #6c757d; padding: 6px 10px; font-size: 12px; color: white; }
    
    .inline-edit-input {
      width: 100%;
      padding: 6px;
      border: 1px solid #800020;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    
    #adminSearchInput { border: 2px solid #800020; background-color: #fff; width: 280px; }
    #adminSearchInput:focus { outline: none; box-shadow: 0 0 5px rgba(128, 0, 32, 0.4); }

    .village-filter-card {
      background: #fff;
      padding: 15px;
      border: 2px solid #800020;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .village-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      max-height: 150px;
      overflow-y: auto;
      padding: 5px;
      border-top: 1px solid #eee;
      margin-top: 10px;
    }
    .village-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .village-item input {
      cursor: pointer;
      accent-color: #800020;
      width: 16px;
      height: 16px;
    }

    /* Card Status Tab Controls */
    .status-filter-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      background: #fff;
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    .status-tab-btn {
      padding: 6px 12px;
      font-size: 13px;
      background: #e9ecef;
      color: #333;
      border: 1px solid #ccc;
    }
    .status-tab-btn.active {
      background: #800020;
      color: white;
      border-color: #800020;
    }
    .card-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #28a745;
    }
    .badge-delivered {
      background: #d4edda;
      color: #155724;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #c3e6cb;
    }
    .badge-pending {
      background: #fff3cd;
      color: #856404;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #ffeeba;
    }
  </style>
</head>
<body>
  <h1>Admin — Manage Entries</h1>
  <div class="top">
    <button type="button" id="goToEntryBtn" onclick="window.location.href='/'">➕ Add New Entry</button>

    <label>Admin password: <input id="adminPw" type="password" /></label>
    <button id="savePw">Save</button>
    <button id="load">Reload</button>
    
    <label style="font-weight:bold;margin-left:5px;">Sort By: 
      <select id="sortBySelect">
        <option value="name">Name</option>
        <option value="address">Address</option>
        <option value="date" selected>Received Date</option>
      </select>
    </label>
    <button id="sortDirBtn" data-dir="desc">Order: Descending (Z-A) ↓</button>

    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="font-weight: bold;">🔍 Live Find:</span>
      <input type="text" id="adminSearchInput" placeholder="Try 'kajhaar' or 'advocate'...">
    </div>

    <button id="exportAdminPdf">📄 Export to PDF</button>
    <button id="clearAll">Clear All Entries</button>
  </div>

  <!-- Village Checkbox Filter -->
  <div class="village-filter-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-weight: bold; color: #800020; font-size: 15px;">📍 Filter by Village / Address (Chuninda gao ka data dekhein):</span>
      <button id="clearVillageSelection" style="padding: 4px 10px; background: #6c757d; font-size: 12px;">Reset Selection</button>
    </div>
    <div id="villageFilterGrid" class="village-grid"></div>
  </div>

  <!-- Card Distribution Status Filter & Batch Actions Bar -->
  <div class="status-filter-bar">
    <span style="font-weight: bold; color: #800020;">💌 Card Status View:</span>
    <button class="status-tab-btn active" data-filter="all" onclick="setCardStatusFilter('all')">Sabhi (All)</button>
    <button class="status-tab-btn" data-filter="pending" onclick="setCardStatusFilter('pending')">⏳ Baaki Hai (Pending)</button>
    <button class="status-tab-btn" data-filter="delivered" onclick="setCardStatusFilter('delivered')">✅ Dila Gaya (Delivered)</button>

    <div style="margin-left: auto; display: flex; gap: 8px; align-items: center;">
      <button id="btnMarkAllGiven" style="background-color: #28a745; font-size: 13px;" onclick="markAllFilteredAsGiven()">
        ✅ Mark All Shown as Given
      </button>
      <button id="btnMarkAllPending" style="background-color: #6c757d; font-size: 13px;" onclick="markAllFilteredAsPending()">
        🔄 Reset Shown to Pending
      </button>
    </div>
  </div>
  
  <div id="status" style="font-weight:bold;margin-bottom:10px;"></div>
  
  <!-- Sahi Aligned 6 Columns -->
  <table id="list">
    <thead>
      <tr>
        <th style="width: 14%;">Card Status</th>
        <th style="width: 26%;">Name</th>
        <th style="width: 24%;">Address</th>
        <th style="width: 10%;">Guests</th>
        <th style="width: 14%;">Phone Number</th>
        <th style="width: 12%;">Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="/admin.js"></script>
</body>
</html>
